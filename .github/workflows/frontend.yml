name: Frontend checks

on:
  pull_request:
    paths:
      - 'proposal/fcc/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'proposal/fcc/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: proposal/fcc
    env:
      FAL_KEY: ''
      FIRMS_MAP_KEY: ''
      WINDY_API_KEY: ''
      VITE_CESIUM_ION_TOKEN: ''
      VITE_GOOGLE_MAPS_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: proposal/fcc/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:spread-precision
      - run: npm test
      - run: npm run test:monitoring
      - run: npm run test:image-lab
      - name: Build without provider keys
        run: npm run build
      - run: npm run test:pwa
      - run: node scripts/check-mati.mjs
